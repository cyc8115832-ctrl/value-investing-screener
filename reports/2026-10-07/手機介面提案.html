<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>手機介面提案｜待確認</title>
<style>
:root{color-scheme:dark;--bg:#0B0F19;--card:#131b2e;--line:#2d3748;--text:#fff;--sub:#cbd5e1;--blue:#38bdf8;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.6 system-ui,"Microsoft JhengHei",sans-serif}button{font:inherit;cursor:pointer;color:inherit}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}header strong{font-size:19px}header small{color:var(--amber);font-size:13px}.sticky{position:sticky;top:0;background:var(--bg);z-index:5}.quote{padding:14px 18px 10px}.quote-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.quote-top span{font-size:14px;color:var(--sub)}.quote-value{font-size:34px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.35}.quote-value small{font-size:14px;font-weight:400;color:var(--sub)}.source{font-size:12px;color:var(--sub);margin:5px 0}.status{display:inline-block;border:1px solid var(--amber);border-radius:5px;color:var(--amber);padding:2px 7px;font-size:12px}.subtabs{display:flex;overflow:auto;padding:0 12px 10px;gap:5px;border-bottom:1px solid var(--line)}.subtabs button{min-height:56px;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;background:#0e1524;padding:8px 12px;font-size:15px}.subtabs button[aria-selected=true]{background:#17364c;color:var(--blue);border-color:var(--blue)}main{max-width:700px;margin:auto;padding:18px 16px calc(115px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}.eyebrow{font-size:12px;color:var(--blue);letter-spacing:1px;margin-bottom:6px}h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 8px}p{margin:0 0 10px}.muted{color:var(--sub);font-size:15px}.price-repeat{padding:8px 0 12px;color:var(--sub);font-size:14px}.price-repeat b{color:white}.unknown{color:var(--amber)}.fact{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}.fact:last-child{border-bottom:0}.fact span{color:var(--sub)}.linkbutton{min-height:56px;width:100%;background:#15384c;border:1px solid var(--blue);border-radius:9px;color:var(--blue);font-size:17px;margin-top:10px}.footnote{font-size:13px;color:var(--sub)}nav{position:fixed;bottom:0;left:0;right:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:#101827;border-top:1px solid var(--line);z-index:10}nav button{min-height:64px;border:0;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;color:var(--sub)}nav button[aria-current=page]{background:#18354b;color:var(--blue)}nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.preview-note{border-left:3px solid var(--amber);background:#1c2030;padding:12px;font-size:14px;color:var(--sub);margin-bottom:16px}.panel[hidden]{display:none}@media(min-width:768px){nav{max-width:700px;left:50%;transform:translateX(-50%);border-radius:15px 15px 0 0}.sticky{max-width:700px;margin:auto}header{max-width:700px;margin:auto}}
</style></head><body>
<header><strong>價值投資研究</strong><small>介面提案・待確認</small></header>
<div class="sticky" id="stockContext"><div class="quote"><div class="quote-top"><b>台積電 <span>2330</span></b><span>最新收盤價</span></div><div class="quote-value">2,585.00 <small>元</small></div><div class="source">2026/10/06 收盤 · 證交所官方資料</div><span class="status">估值待驗證 · 暫不判定位階</span></div>
<div class="subtabs" role="tablist" aria-label="個股分析分頁"><button role="tab" aria-selected="true" data-panel="結論">結論</button><button role="tab" aria-selected="false" data-panel="基本面">基本面</button><button role="tab" aria-selected="false" data-panel="價位">價位</button><button role="tab" aria-selected="false" data-panel="EPS">EPS</button><button role="tab" aria-selected="false" data-panel="籌碼">籌碼</button><button role="tab" aria-selected="false" data-panel="研究">研究</button></div></div>
<main id="main"><div class="preview-note">這是獨立設計樣稿。收盤價與倍數已核對；估值、財報與投資結論仍待驗證。</div><div id="panelBody"></div></main>
<nav aria-label="主功能"><button data-main="雷達"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 3v9l7-5"/><circle cx="8" cy="15" r="1"/></svg><span>雷達</span></button><button data-main="選股"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 8h6M7 11h4"/></svg><span>選股</span></button><button data-main="個股" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M6 15l4-5 4 3 6-8"/></svg><span>個股</span></button><button data-main="觀察"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3-5.7-3-5.7 3 1.1-6.3L3 9.7l6.2-.9Z"/></svg><span>觀察</span></button><button data-main="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="#101827"/><circle cx="16" cy="12" r="2" fill="#101827"/><circle cx="10" cy="18" r="2" fill="#101827"/></svg><span>設定</span></button></nav>
<style>.subtabs button{padding:8px 9px;font-size:14px}.subtabs{scrollbar-width:none}.subtabs::-webkit-scrollbar{display:none}</style>
<script>
const content={
'結論':['先確認公司，再判斷價格','目前可確認的行情','<div class="fact"><span>收盤價</span><b>2,585.00 元</b></div><div class="fact"><span>官方本益比</span><b>29.96 倍</b></div><div class="fact"><span>官方股價淨值比</span><b>10.42 倍</b></div>','現有財報與預估 EPS 需重新驗證。尚不能用原模型的「瘋狂價」或「好公司」標籤作為結論。'],
'基本面':['公司的獲利是否有品質？','品質與資料完整度','<div class="fact"><span>營收與三率</span><b class="unknown">待核對完整期間</b></div><div class="fact"><span>現金流與負債</span><b class="unknown">待補官方報表</b></div>','正式畫面應列出財報期間、公告日期與來源。缺資料使用灰燈，避免給出預設綠燈。'],
'價位':['價格是否提供足夠緩衝？','估值方法與適用性','<div class="fact"><span>估值基準</span><b class="unknown">尚未驗證</b></div><div class="fact"><span>便宜／合理／昂貴</span><b class="unknown">暫不提供</b></div>','待真實個股歷史倍數與 EPS 基準確認後，再展示河流圖。現價標線應永遠出現在可見範圍。'],
'EPS':['實績與預估分開看','預估需要哪些證據？','<div class="fact"><span>近四季 EPS</span><b class="unknown">待財報核對</b></div><div class="fact"><span>年度預估 EPS</span><b class="unknown">待重新計算</b></div>','每頁保留現價，並以正確年度 EPS 計算對應本益比。預估要列出營收、淨利率、股數與情境假設。'],
'籌碼':['用輔助訊號確認研究方向','三大法人與內部人','<div class="fact"><span>法人買賣超</span><b class="unknown">待官方來源</b></div><div class="fact"><span>持股與月 KD</span><b class="unknown">待實際計算</b></div>','不以固定買超、固定持股比例或固定黃金交叉來製造轉強訊號。'],
'研究':['每個推論都有證據','研究紀錄與反證','<div class="fact"><span>資料事實</span><b>來源與日期</b></div><div class="fact"><span>投資推論</span><b>假設與反證</b></div>','應分開列出事實、假設、未知與下次檢查日期。研究理由被推翻時提示重新評估。']};
function render(name){const c=content[name];document.getElementById('panelBody').innerHTML=`<div class="eyebrow">個股研究 / ${name}</div><h1>${c[0]}</h1><div class="price-repeat">本頁比較基準：<b>現價 2,585.00 元</b><br>2026/10/06 收盤 · 非即時報價</div><section class="card"><h2>${c[1]}</h2>${c[2]}</section><section class="card"><h2>研究提示</h2><p class="muted">${c[3]}</p></section><p class="footnote">數字有來源，結論有條件。資料不足時，等待也是有紀律的選擇。</p>`}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render(b.dataset.panel)}));
document.querySelectorAll('[data-main]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-main]').forEach(x=>{x.removeAttribute('aria-current')});b.setAttribute('aria-current','page');const name=b.dataset.main;document.getElementById('stockContext').hidden=name!=='個股';if(name==='個股'){render('結論');document.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.panel==='結論')))}else{document.getElementById('panelBody').innerHTML=`<div class="eyebrow">主功能 / ${name}</div><h1>${name}</h1><section class="card"><h2>底部入口示意</h2><p class="muted">${name==='設定'?'字級、長輩模式、教學沙盒與操作手冊集中在這裡。':'此樣稿只示意主功能切換。正式內容保留現有功能，依核准計畫改善。'}</p></section>`}}));render('結論');
</script></body></html>
